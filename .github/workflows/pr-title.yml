name: PR title

# Squash merges use the PR title as the commit on main, so it must be a
# conventional commit for release-please to pick it up.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    name: Conventional PR title
    # Release PRs are opened and merged by the release workflow in seconds; skip them.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
