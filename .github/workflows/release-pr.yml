name: Release PR

# Keeps one release PR open and up to date with every push to main. Releasing
# is the manual "Release & deploy" workflow, which merges this PR.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency: release-pr

jobs:
  release-pr:
    name: Update release PR
    runs-on: ubuntu-latest
    steps:
      # Opened with a PAT so the PR has a trusted author: PRs from
      # github-actions[bot] wait for approval and their CI expires.
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
