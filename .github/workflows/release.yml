name: Release

# Runs on every push to main. release-please keeps one release PR open and up
# to date (fix: → patch, feat: → minor, feat!: / BREAKING CHANGE → major).
# Merging that PR (by hand or with Actions → "Release now") is the release:
# the merge pushes to main, this runs again, tags it, creates the GitHub
# release and deploys.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency: release

jobs:
  release:
    name: Release (release-please)
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
    steps:
      # A PAT so the PR has a trusted author: PRs from github-actions[bot]
      # wait for approval and their CI expires.
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
