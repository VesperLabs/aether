name: Release

# Every push to main releases itself, no clicks:
# 1. A feature merge: release-please opens/updates the release PR (fix: → patch,
#    feat: → minor, feat!: / BREAKING CHANGE → major) and this job merges it.
# 2. That merge pushes to main, this runs again, tags it, creates the GitHub
#    release and deploys.
# The PAT matters: pushes made with GITHUB_TOKEN don't trigger workflows, so
# step 2 would never run.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency: release

jobs:
  release:
    name: Release (release-please)
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Merge the release PR
        if: steps.release.outputs.pr
        run: gh pr merge "$PR" --repo "$REPO" --squash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ fromJSON(steps.release.outputs.pr).number }}

  deploy:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
