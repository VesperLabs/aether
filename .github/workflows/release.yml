name: Release

# Every push to main releases itself, no clicks:
# 1. A feature merge: release-please opens/updates the release PR (fix: → patch,
#    feat: → minor, feat!: / BREAKING CHANGE → major) and this job merges it.
# 2. That merge pushes to main, this runs again, tags it, creates the GitHub
#    release and deploys.
# The PAT matters: pushes made with GITHUB_TOKEN don't trigger workflows, so
# step 2 would never run.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Queued, never run side by side: two runs at once raced on the same release PR
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release (release-please)
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Found by its branch, not its label: a label just added isn't searchable yet, so a label
      # lookup came back empty and left the PR stuck. --auto merges it once its checks pass,
      # instead of failing while they still run.
      - name: Merge the release PR
        if: steps.release.outputs.release_created != 'true'
        run: |
          PR=$(gh pr list --repo "$REPO" --state open --head "$BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then gh pr merge "$PR" --repo "$REPO" --squash --auto; fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: release-please--branches--main--components--aether

  deploy:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
