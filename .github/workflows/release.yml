name: Release

# Bumps the version from conventional commits (fix: → patch, feat: → minor,
# feat!: / BREAKING CHANGE → major). On each push to main it opens or updates a
# release PR with the new package.json version and CHANGELOG.md; merging that
# PR tags the release and creates a GitHub release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
