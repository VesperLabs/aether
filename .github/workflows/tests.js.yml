name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # One job per gate, run in parallel, so a single run reports every failure.
  gate:
    name: ${{ matrix.name }}
    # Release PRs are opened and merged by the release workflow in seconds; skip them.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format, lint, types
            run: npm run check:format && npm run lint && npm run typecheck && npm run check:structure
          - name: Tests
            run: npm run test
          - name: Build
            run: npm run client:build && npm run web:build && npm run server:build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26 # matches the Dockerfile
          cache: npm
      - run: npm ci
      - run: ${{ matrix.run }}
