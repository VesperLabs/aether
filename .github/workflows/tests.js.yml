name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # One job per gate, run in parallel, so a single run reports every failure.
  gate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format, lint, types
            run: npm run check:format && npm run lint && npm run typecheck
          - name: Tests
            run: npm run test
          - name: Build
            run: npm run client:build && npm run web:build && npm run server:build
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26 # matches the Dockerfile
          cache: npm
      - run: npm ci
      - run: ${{ matrix.run }}

  # Deploys live here (not a separate workflow) so the push's changed files
  # are available for the Render path filter.
  fly:
    name: Deploy game (Fly)
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-fly
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  render:
    name: Deploy wiki + assets (Render)
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-render
    steps:
      - uses: actions/checkout@v5
      # Render only serves the wiki and static assets; skip when neither changed.
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            render:
              - "public/**"
              - "web/**"
              - "ui/**"
              - "shared/**"
              - "package-lock.json"
      - if: steps.changes.outputs.render == 'true'
        run: curl -fsS -X POST "${RENDER_DEPLOY_HOOK}&ref=${GITHUB_SHA}"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
