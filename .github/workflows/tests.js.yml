name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # One job per gate, run in parallel, so a single run reports every failure.
  gate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format, lint, types
            run: npm run check:format && npm run lint && npm run typecheck && npm run check:structure
          - name: Tests
            run: npm run test
          - name: Build
            run: npm run client:build && npm run web:build && npm run server:build
    # Release PRs are opened and merged by the release workflow in seconds. Skip
    # their steps, not the job, so the required check names still report success.
    env:
      SKIP: ${{ startsWith(github.head_ref, 'release-please--') }}
    steps:
      - if: env.SKIP != 'true'
        uses: actions/checkout@v5
      - if: env.SKIP != 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 26 # matches the Dockerfile
          cache: npm
      - if: env.SKIP != 'true'
        run: npm ci
      - if: env.SKIP != 'true'
        run: ${{ matrix.run }}
