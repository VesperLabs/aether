<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Aether</title>
    <style>
      /* A soft wash of the world's colours, inline so it paints before anything has loaded.
         LoginBackdrop takes over from body::before and fades it out once the world has drawn. */
      :root {
        --login-wash:
          radial-gradient(ellipse at 22% 30%, #2f6b3f 0%, transparent 60%),
          radial-gradient(ellipse at 80% 72%, #1f4f7a 0%, transparent 60%),
          radial-gradient(ellipse at 60% 15%, #5c6b34 0%, transparent 50%), #12241f;
      }
      body {
        background: black;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: var(--login-wash);
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="root"></div>
    <script type="text/javascript">
      /* Monkeypatches warnings */
      const oldGetContext = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (type, options) {
        const context = oldGetContext.call(this, type, { ...options, willReadFrequently: true });
        return context;
      };
    </script>
    <script type="module" src="game.tsx"></script>
  </body>
</html>
